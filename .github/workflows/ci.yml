name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, analytics and PDF tests
        run: npm test
      - name: Database, lifecycle and RLS checks (PGlite)
        run: npm run test:db
      - name: Production build
        run: npx vite build
